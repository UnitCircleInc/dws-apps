<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DWT Sensor Board Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f0f1e;
      color: #ccc;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      overflow: hidden;
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ---- Header ---- */
    #header {
      flex: 0 0 auto;
      background: #161628;
      border-bottom: 1px solid #2a2a44;
      padding: 4px 8px;
    }

    #status-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #connect-btn {
      background: #1e3a5f;
      color: #7ec8e3;
      border: 1px solid #2a5a8f;
      border-radius: 3px;
      padding: 2px 10px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    #connect-btn:hover { background: #254e80; }

    #status-text { color: #aaa; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #rate-text   { color: #888; white-space: nowrap; }
    #temp-text   { color: #a8d8a8; white-space: nowrap; }

    #version-text {
      margin-top: 2px;
      color: #666;
      font-size: 11px;
      min-height: 14px;
    }

    /* ---- Plots ---- */
    #plots {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
    }

    /* ---- Warning banner (shown when Web Serial not available) ---- */
    #no-serial-warn {
      display: none;
      background: #3a1a00;
      color: #ffaa44;
      border: 1px solid #884400;
      padding: 8px 12px;
      margin: 4px;
      border-radius: 3px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div id="root">

  <div id="header">
    <div id="status-row">
      <button id="connect-btn">Connect</button>
      <span id="status-text">Checking browser…</span>
      <span id="rate-text"></span>
      <span id="temp-text"></span>
    </div>
    <div id="version-text"></div>
  </div>

  <div id="no-serial-warn">
    ⚠ Web Serial API is not available in this browser.<br>
    Use <strong>Chrome 89+</strong> or <strong>Edge 89+</strong>.
    Safari does not support Web Serial API (as of 2025).
  </div>

  <div id="plots">
    <canvas id="fft-canvas"></canvas>
    <canvas id="pres-canvas"></canvas>
  </div>

</div>

<!--
  sensor.js is generated by emcc.  It loads sensor.wasm from the same directory.
  app.js must load after sensor.js so that SensorModule() is in scope.
-->
<script src="sensor.js"></script>
<script src="app.js"></script>

<script>
  /* Show warning if Web Serial is unavailable (Safari, Firefox, etc.) */
  if (!('serial' in navigator)) {
    document.getElementById('no-serial-warn').style.display = 'block';
    document.getElementById('status-text').textContent =
      'Web Serial not supported — Chrome or Edge required.';
    document.getElementById('connect-btn').disabled = true;
  }
</script>
</body>
</html>
